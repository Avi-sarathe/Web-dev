<!DOCTYPE html>
<html lang="en">
<head>
    <title>Photo Overlay</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        img {
            width: 100%;
            height: 100vh;
            filter: blur(2px);
        }
        .name div{
            position: absolute;
            font-size: 20px;
            font-weight: bold;
            color: black;
        }
        .top-left {
            top: 10px;
            left: 10px;
        }
        .top-center {
            top: 10px;
            left: 50%;
        }
        .top-right {
            top: 10px;
            right: 10px;
        }
        .middle-left {
            top: 50%;
            left: 10px;
        }
        .center {
            top: 50%;
            left: 50%;
        }
        .middle-right {
            top: 50%;
            right: 10px;
        }
        .bottom-left {
            bottom: 10px;
            left: 10px;
        }
        .bottom-center {
            bottom: 10px;
            left: 50%;
        }
        .bottom-right {
            bottom: 10px;
            right: 10px;
        }
    </style>
</head>
<body>
    <div class="name">
        <img src="photograph.jpeg" alt="My photo">
        <div class="top-left">avirishu</div>
        <div class="top-center">avirishu</div>
        <div class="top-right">avirishu</div>
        <div class="middle-left">avirishu</div>
        <div class="center">avirishu</div>
        <div class="middle-right">avirishu</div>
        <div class="bottom-left">avirishu</div>
        <div class="bottom-center">avirishu</div>
        <div class="bottom-right">avirishu</div>
    </div>
</body>
</html>
