<!DOCTYPE html>
<html>
<head>
<style>
img {
  position: absolute;
  left: 0px;
  top: 0px;
  z-index: -1;
}
</style>
</head>
<body>

<h1>This is a heading</h1>
<img src="https://cdn.pixabay.com/photo/2017/01/31/22/47/tree-2027899_1280.png" alt="image not found">
<p>This image contains a z-index of -1, it will be placed behind the text.</p>

</body>
</html>
