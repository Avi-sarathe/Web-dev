<!DOCTYPE html>
<html>
<head>
<style>
img {
      position: absolute;
       left: 0px;
       top: 0px;
      z-index: -1;
 }
     </style>
</head>
<body>

      <h1>This is a heading</h1>
       <img src="https://i.pinimg.com/736x/e1/a1/ff/e1a1ff0945ac7eb00776a7277322c33c.jpg" alt="image not found">
     <p>This image contains a z-index of -1, it will be placed behind the text.</p>

</body>
</html>
